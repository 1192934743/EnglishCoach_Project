name: Azure VM Auto Deploy

# 只有当代码 push 到 azure 分支时才触发
on:
  push:
    branches:
      - azure

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          # 如果你的 SSH 端口不是 22，请在这里指定
          port: 22
          script: |
            # 1. 遇到任何错误立即停止执行，GitHub Actions 会直接标红报错
            set -e

            # 2. 进入目录
            cd /home/ubuntu/EnglishCoach_Project/python_backend

            # 3. 强制修复可能的权限问题（双重保险）
            sudo chown -R ubuntu:ubuntu .

            # 4. 彻底同步代码
            # fetch 远程分支，然后强制重置本地状态，解决所有冲突
            git fetch origin azure
            git reset --hard origin/azure

            # 5. 重建并启动容器
            # 确保这里是你 docker-compose.yml 所在的目录
            sudo docker compose up -d --build backend

            # 6. 清理残留的虚悬镜像（节省空间）
            sudo docker image prune -f

            echo "🚀 Actual deployment success!"