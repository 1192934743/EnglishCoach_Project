[pytest]
# ================= 标记定义 =================
markers =
    critical_path: Critical path tests for every commit (must pass 100%)
    full_regression: Full regression suite for release
    nightly: Nightly tests (long-running, include performance)
    flaky: Flaky tests with automatic retry
    unit: Unit tests for individual functions
    e2e: End-to-end integration tests

# ================= 超时配置 =================
timeout = 300
timeout_method = thread

# ================= 输出配置 =================
console_output_style = progress
addopts = --strict-markers -v

# ================= 覆盖率配置 =================
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    conftest.py

# ================= 报告配置 =================
junit_family = xunit2
