# pytest.ini - EnglishCoach 端到端测试配置

[pytest]
# 标记定义
markers =
    critical_path: Critical path tests for every commit
    full_regression: Full regression suite for release
    nightly: Nightly tests (long-running, include performance)
    flaky: Flaky tests with automatic retry
    unit: Unit tests for isolated components
    integration: Integration tests for component interaction

# 异步测试配置
asyncio_mode = auto

# 超时配置
timeout = 300
timeout_method = thread

# 输出配置
console_output_style = progress
addopts = --strict-markers

# 测试路径
testpaths = tests

# 覆盖率配置
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
