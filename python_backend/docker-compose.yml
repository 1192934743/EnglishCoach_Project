version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishcoach-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
    environment:
      # 确保容器内时区正确
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
